<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the root-owned system service may own this well-known name. -->
  <policy user="root">
    <allow own="io.github.omerfaruknehir.AsusA14"/>
  </policy>

  <!-- Calls are accepted by the bus, then SetProfile performs a second
       credential check and permits mutation only from root or an ordinary
       local user with an active /run/user/<uid>/bus session. The service has
       no raw EC/register/PWM/MMIO API. -->
  <policy context="default">
    <allow send_destination="io.github.omerfaruknehir.AsusA14"/>
  </policy>
</busconfig>
