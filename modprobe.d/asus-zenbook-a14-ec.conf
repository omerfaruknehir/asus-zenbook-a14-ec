# Safe defaults. The EC module is loaded late by its systemd service,
# not by systemd-modules-load, to avoid probing the EC too early in boot.
# Named power modes are the four ASUS firmware modes only; the firmware owns
# their fan curves. performance_pwm/manual_trip_mc apply only to explicit
# CUSTOM hwmon/manual fan control and are not used by named power modes.
options asus_zenbook_a14_ec probe_delay_ms=1000 performance_pwm=220 manual_trip_mc=85000
options hid_asus_ec initial_brightness=1 enable_debug_commands=0
