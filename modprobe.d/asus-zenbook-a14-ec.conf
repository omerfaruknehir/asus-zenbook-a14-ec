# Safe defaults. The A14 EC/HID modules are loaded explicitly and in order by
# asus-zenbook-a14-ec.service after the Qualcomm I2C controller is registered.
#
# Both modules publish device aliases, so without these blacklist entries udev
# can auto-load them during cold boot before the late-loader runs. `blacklist`
# suppresses alias-driven loading; explicit `modprobe <module>` from the service
# still works. This makes the intended EC-first -> HID-second boot ordering
# deterministic while leaving normal module administration available.
blacklist asus_zenbook_a14_ec
blacklist hid_asus_ec

# Quiet/Normal/Turbo/Full Speed are untouched ASUS firmware modes. Whisper is
# the only synthetic mode: it favors throttling over audible cooling, attempts
# zero fan PWM, and silently falls back to ASUS Quiet when temperature requires.
# Thresholds use millidegrees Celsius; CPU limits are percentages of each
# cpufreq policy's own hardware maximum.
options asus_zenbook_a14_ec probe_delay_ms=1000 whisper_cpu_cool_percent=60 whisper_cpu_warm_percent=45 whisper_cpu_hot_percent=30 whisper_warm_mc=50000 whisper_hot_mc=60000 whisper_fan_mc=68000 whisper_recover_mc=55000 whisper_period_ms=1000 performance_pwm=220 manual_trip_mc=85000
# performance_pwm/manual_trip_mc are used only by explicit CUSTOM/manual hwmon
# control; they are never applied to Turbo or Full Speed.
options hid_asus_ec initial_brightness=1 enable_debug_commands=0
