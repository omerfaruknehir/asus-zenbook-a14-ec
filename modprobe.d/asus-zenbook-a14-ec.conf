# Safe defaults. The EC module is loaded late by its systemd service,
# not by systemd-modules-load, to avoid probing the EC too early in boot.
# Frequency ceilings are percentages of each heterogeneous X Elite cpufreq
# policy's own native maximum, not one fixed frequency for every cluster.
# Quiet deliberately stops both fans only when CPU frequency QoS is attached;
# emergency cooling hands fan ownership back to firmware AUTO/Turbo.
options asus_zenbook_a14_ec probe_delay_ms=1000 quiet_max_percent=45 power_saver_max_percent=70 quiet_fan_pwm=0 quiet_emergency_mc=90000 quiet_recover_mc=75000 performance_pwm=220 manual_trip_mc=85000
options hid_asus_ec initial_brightness=1 enable_debug_commands=0
