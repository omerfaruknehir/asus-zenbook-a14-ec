name: Validate AOS CPAS quarantine

on:
  push:
    paths:
      - 'kernel/aos/**'
      - 'kernel-patches/aos/cpas-handoff/**'
      - 'kernel-patches/aos/diagnostics/**'
      - 'kernel-patches/aos/power-diagnostics/**'
      - 'docs/aos/**'
      - 'scripts/a14-aos-stage-*.sh'
      - 'scripts/a14-aos-power-*.sh'
      - '.github/workflows/aos-cpas-handoff.yml'
  pull_request:
    paths:
      - 'kernel/aos/**'
      - 'kernel-patches/aos/cpas-handoff/**'
      - 'kernel-patches/aos/diagnostics/**'
      - 'kernel-patches/aos/power-diagnostics/**'
      - 'docs/aos/**'
      - 'scripts/a14-aos-stage-*.sh'
      - 'scripts/a14-aos-power-*.sh'
      - '.github/workflows/aos-cpas-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production patch metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 kernel-patches/aos/cpas-handoff/normalize-patch.py --check \
            kernel-patches/aos/cpas-handoff/0*.patch

      - name: Validate quarantine and safe diagnostics
        shell: bash
        run: |
          set -euo pipefail
          sh -n kernel-patches/aos/cpas-handoff/apply.sh
          for script in scripts/a14-aos-stage-*.sh scripts/a14-aos-power-*.sh; do
            bash -n "$script"
          done

          power_patch=kernel-patches/aos/power-diagnostics/0001-media-qcom-camss-add-platform-power-probe.patch
          test -s docs/aos/WINDOWS-AOS-PLATFORM-HANDOFF.md
          test -s kernel-patches/aos/cpas-handoff/0005-media-qcom-camss-quarantine-direct-aon-mmio.patch
          test -s "$power_patch"
          test -s scripts/a14-aos-power-diag-build.sh
          test -s scripts/a14-aos-power-diag-install-test.sh
          test -s scripts/a14-aos-power-diag-run.sh

          grep -q '0005-media-qcom-camss-quarantine-direct-aon-mmio.patch' \
            kernel-patches/aos/cpas-handoff/apply.sh
          grep -q 'returns -EOPNOTSUPP before' \
            kernel-patches/aos/cpas-handoff/apply.sh
          grep -q 'Direct host MMIO access to the AON mux is quarantined' \
            kernel-patches/aos/cpas-handoff/README.md
          grep -q 'stage 3 is retired' scripts/a14-aos-stage-diag-run.sh
          grep -q 'stage 4 is permanently blocked' scripts/a14-aos-stage-diag-run.sh
          grep -q 'write-capable A14 AON diagnostic module has been retired' \
            scripts/a14-aos-stage-diag-build.sh
          grep -q 'installation of the write-capable A14 AON diagnostic is blocked' \
            scripts/a14-aos-stage-diag-install-test.sh

          grep -q 'platform-power-no-mmio-v1' scripts/a14-aos-power-diag-build.sh
          grep -q 'direct_cpas_mmio_allowed=false' scripts/a14-aos-power-diag-build.sh
          grep -q 'ssc_activation_allowed=false' scripts/a14-aos-power-diag-build.sh
          grep -q 'AON-POWER-DIAG begin direct-mmio=false' "$power_patch"
          grep -q 'aon_power_diag/aon_power_probe' scripts/a14-aos-power-diag-run.sh

          if find kernel-patches/aos/diagnostics -type f -name '*.patch' \
              -print -quit 2>/dev/null | grep -q .; then
            echo 'Retired write-capable diagnostic patches must not return' >&2
            exit 1
          fi

          if grep -R -E 'ap-write-no-read|aon-switch-restore-no-read|confirm-mmio-write|confirm-aon-switch' \
              scripts kernel-patches/aos/diagnostics 2>/dev/null; then
            echo 'A runnable direct-MMIO diagnostic path remains' >&2
            exit 1
          fi

          if grep -R -E '0x0ac191e0|devm_ioremap.*0x0ac19|ioremap.*0x0ac19' kernel/aos; then
            echo 'SSC consumer must not map the physical CPAS address' >&2
            exit 1
          fi

          if grep -E '^\+.*\<(readl|writel|ioread|iowrite)\>' "$power_patch"; then
            echo 'The platform-power diagnostic patch must not add direct MMIO' >&2
            exit 1
          fi

          if grep -E '^\+.*(qcom_ssc_hpd|camera-handshake|INIT 576)' "$power_patch"; then
            echo 'The platform-power diagnostic patch must not contact SSC' >&2
            exit 1
          fi

          for patch in kernel-patches/aos/cpas-handoff/0*.patch "$power_patch"; do
            git apply --numstat "$patch" >/dev/null
          done

      - name: Check quarantine and power probe against Linux master
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/torvalds/linux.git linux
          git -C linux sparse-checkout set --no-cone \
            Documentation/devicetree/bindings/media/qcom,x1e80100-camss.yaml \
            drivers/media/platform/qcom/camss/ \
            include/media/ \
            arch/arm64/boot/dts/qcom/x1e80100-asus-zenbook-a14.dts

          for patch in "$GITHUB_WORKSPACE"/kernel-patches/aos/cpas-handoff/0*.patch; do
            git -C linux apply --check "$patch"
            git -C linux apply "$patch"
          done

          camss=linux/drivers/media/platform/qcom/camss/camss.c
          grep -q 'AON handoff unavailable: direct CPAS MMIO resets this platform' "$camss"
          grep -q 'ret = -EOPNOTSUPP' "$camss"
          ! grep -q 'aon_diag_stage' "$camss"

          provider=$(sed -n \
            '/int qcom_camss_aon_acquire/,/EXPORT_SYMBOL_GPL(qcom_camss_aon_release)/p' \
            "$camss")
          if printf '%s\n' "$provider" | grep -Eq '\<(readl|writel)\>'; then
            echo 'Direct AON MMIO remains in the final provider implementation' >&2
            exit 1
          fi

          power_patch="$GITHUB_WORKSPACE/kernel-patches/aos/power-diagnostics/0001-media-qcom-camss-add-platform-power-probe.patch"
          git -C linux apply --check "$power_patch"
          git -C linux apply "$power_patch"

          grep -q 'aon_power_probe' "$camss"
          grep -q 'X1E_AON_POWER_CLK_COUNT' "$camss"
          for clock in camnoc_rt_axi camnoc_nrt_axi cpas_ahb core_ahb \
                       cpas_fast_ahb gcc_axi_hf gcc_axi_sf; do
            grep -q "\"$clock\"" "$camss"
          done

          helper=$(sed -n \
            '/static int qcom_camss_aon_power_probe/,/static DEVICE_ATTR_WO(aon_power_probe)/p' \
            "$camss")
          if printf '%s\n' "$helper" | grep -Eq '\<(readl|writel|ioread|iowrite)\>'; then
            echo 'The platform-power diagnostic helper contains direct MMIO' >&2
            exit 1
          fi
          if printf '%s\n' "$helper" | grep -Eq 'qcom_ssc_hpd|camera.handshake|INIT 576'; then
            echo 'The platform-power diagnostic helper contains an SSC path' >&2
            exit 1
          fi

      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-generic

      - name: Compile discovery-only SSC module
        shell: bash
        run: |
          set -euo pipefail
          kdir=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n1)
          test -n "$kdir"
          make -C kernel/aos clean KDIR="$kdir"
          make -C kernel/aos KDIR="$kdir" W=1 KBUILD_MODPOST_WARN=1
          test -s kernel/aos/qcom_ssc_hpd.ko

      - name: Compile CAMSS-provider SSC integration
        shell: bash
        run: |
          set -euo pipefail
          kdir=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n1)
          test -n "$kdir"
          make -C kernel/aos clean KDIR="$kdir"
          make -C kernel/aos \
            KDIR="$kdir" \
            W=1 \
            KBUILD_MODPOST_WARN=1 \
            AOS_CAMSS_HANDOFF=1 \
            AOS_CAMSS_INCLUDE="$GITHUB_WORKSPACE/kernel/aos/test-include"
          test -s kernel/aos/qcom_ssc_hpd.ko
