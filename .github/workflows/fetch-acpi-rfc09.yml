name: Fetch ACPI RFC09

on:
  workflow_dispatch:
  push:
    branches: [agent/a14-full-acpi]
    paths:
      - '.github/workflows/fetch-acpi-rfc09.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve and fetch original RFC patch 09/12
        shell: bash
        run: |
          set -euxo pipefail
          subject='[RFC 09/12] pinctrl: qcom: Add support for WoA ACPI tables virtual TLMM pin numbers'

          # lore currently rejects automated raw-mail retrieval. Resolve the
          # same public mailing-list message from the Spinics devicetree mirror.
          curl --fail --location --retry 3 --max-time 30 \
            'https://www.spinics.net/lists/devicetree/index.html' -o spinics-index.html

          python3 - <<'PY' > patch-url.txt
          import html
          import re
          from urllib.parse import urljoin

          data = open('spinics-index.html', encoding='utf-8', errors='replace').read()
          target = 'RFC 09/12'
          for m in re.finditer(r'<a\s+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', data, re.I | re.S):
              label = html.unescape(re.sub(r'<[^>]+>', '', m.group(2)))
              if target in label and 'virtual TLMM pin' in label:
                  print(urljoin('https://www.spinics.net/lists/devicetree/', html.unescape(m.group(1))))
                  break
          else:
              raise SystemExit('RFC09 link not found in Spinics index')
          PY

          patch_url="$(cat patch-url.txt)"
          echo "patch_url=$patch_url"
          curl --fail --location --retry 3 --max-time 30 "$patch_url" -o rfc09.html

          python3 - <<'PY' > rfc09.txt
          import html
          import re
          data = open('rfc09.html', encoding='utf-8', errors='replace').read()
          # Spinics messages are preformatted; preserve the mailed patch text.
          m = re.search(r'<pre[^>]*>(.*?)</pre>', data, re.I | re.S)
          if not m:
              raise SystemExit('message pre block not found')
          text = html.unescape(re.sub(r'<[^>]+>', '', m.group(1)))
          print(text, end='' if text.endswith('\n') else '\n')
          PY

          grep -F '[RFC 09/12]' rfc09.txt
          grep -F 'pinctrl-msm-acpi.c' rfc09.txt
          sha256sum rfc09.txt | tee rfc09.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: acpi-rfc09-original
          path: |
            rfc09.txt
            rfc09.sha256
            patch-url.txt
          if-no-files-found: error
