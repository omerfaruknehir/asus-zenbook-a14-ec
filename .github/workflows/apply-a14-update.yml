name: Apply hardened A14 update

on:
  push:
    branches:
      - agent/harden-and-package

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-and-package
      - name: Apply generated source update
        shell: bash
        run: |
          set -euxo pipefail
          tar -xzf .bootstrap/a14-update.tar.gz -C . \
            --exclude='.github/workflows/build-deb.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'harden drivers and add DKMS DEB installer'
          git push origin HEAD:agent/harden-and-package
