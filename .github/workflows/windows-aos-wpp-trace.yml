name: Validate Windows AOS WPP trace

on:
  push:
    paths:
      - 'scripts/a14-windows-aos-wpp-trace.ps1'
      - 'docs/aos/WINDOWS-AOS-WPP-STATIC-TRACE.md'
      - '.github/workflows/windows-aos-wpp-trace.yml'
  pull_request:
    paths:
      - 'scripts/a14-windows-aos-wpp-trace.ps1'
      - 'docs/aos/WINDOWS-AOS-WPP-STATIC-TRACE.md'
      - '.github/workflows/windows-aos-wpp-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell 5.1 collector
        shell: powershell
        run: |
          $path = 'scripts/a14-windows-aos-wpp-trace.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -ne 0) {
              $errors | Format-List *
              throw "PowerShell parser reported $($errors.Count) error(s)."
          }

      - name: Enforce targeted trace safety boundary
        shell: powershell
        run: |
          $path = 'scripts/a14-windows-aos-wpp-trace.ps1'
          $script = Get-Content $path -Raw
          foreach ($required in @(
              'DDF06AD3-2B53-4825-B2C6-B9CAE6E680C1',
              '66E62EB6-C99F-34ED-A782-B77E267F4B2D',
              'Microsoft-Windows-Kernel-Power',
              'logman.exe',
              'collector_sends_platform_ioctl=false',
              'devices_restarted=false',
              'pnp_state_modified=false',
              'camera_register_access=false',
              'direct_cpas_mmio=false',
              'ssc_contact=false'
          )) {
              if (-not $script.Contains($required)) {
                  throw "Missing required invariant: $required"
              }
          }

          if ($script -match 'DeviceIoControl|CreateFileW|Set-PnpDevice|Disable-PnpDevice|Enable-PnpDevice|devcon(?:\.exe)?|MmMapIoSpace|\\dev\\mem|0x0ac191e0|ioremap|\breadl\s*\(|\bwritel\s*\(|HumanPresenceSensor\]::GetDefault|GetCurrentReading\(') {
              throw 'Targeted AOS WPP collector contains a prohibited control path.'
          }

      - name: Check repository whitespace
        shell: bash
        run: git diff --check HEAD^ HEAD || git diff --check
