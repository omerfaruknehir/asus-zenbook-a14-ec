name: Validate Windows boot process identity exporter

on:
  push:
    paths:
      - 'scripts/a14-windows-boot-process-identity-export.ps1'
      - '.github/workflows/windows-boot-process-identity-export.yml'
  pull_request:
    paths:
      - 'scripts/a14-windows-boot-process-identity-export.ps1'
      - '.github/workflows/windows-boot-process-identity-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell 5.1 exporter
        shell: powershell
        run: |
          $path = 'scripts/a14-windows-boot-process-identity-export.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
          )
          if ($errors.Count -ne 0) {
              $errors | Format-List *
              throw "PowerShell parser reported $($errors.Count) error(s)."
          }

      - name: Enforce offline-only process boundary
        shell: powershell
        run: |
          $path = 'scripts/a14-windows-boot-process-identity-export.ps1'
          $script = Get-Content $path -Raw

          foreach ($required in @(
              'Microsoft-Windows-Kernel-Process',
              '22FB2CD6-0E7B-422B-A0C7-2FAD1FD0E716',
              '10252',
              '8288',
              '5560',
              'target-process-events.csv',
              'operation=offline-decode-only',
              'process_control=false',
              'collector_sends_platform_ioctl=false',
              'devices_restarted=false',
              'camera_register_access=false',
              'direct_cpas_mmio=false'
          )) {
              if (-not $script.Contains($required)) {
                  throw "Missing required process-export invariant: $required"
              }
          }

          if ($script -match 'Stop-Process|Start-Process|DeviceIoControl|CreateFileW|WriteFile|Set-PnpDevice|Disable-PnpDevice|Enable-PnpDevice|devcon(?:\.exe)?|MmMapIoSpace|\\dev\\mem|0x0ac191e0|ioremap|\breadl\s*\(|\bwritel\s*\(|HumanPresenceSensor\]::GetDefault|GetCurrentReading\(') {
              throw 'Process identity exporter contains a prohibited runtime/hardware-control path.'
          }

      - name: Check repository whitespace
        shell: bash
        run: git diff --check HEAD^ HEAD || git diff --check
