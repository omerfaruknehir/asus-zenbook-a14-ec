name: Build DEB

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and package
        run: ./scripts/test-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: asus-zenbook-a14-ec-deb
          path: dist/*.deb
