name: Validate Windows camera-platform audits

on:
  push:
    paths:
      - 'scripts/a14-windows-camera-platform-audit.ps1'
      - 'scripts/a14-windows-camera-platform-focused-audit.ps1'
      - '.github/workflows/windows-camera-audit.yml'
  pull_request:
    paths:
      - 'scripts/a14-windows-camera-platform-audit.ps1'
      - 'scripts/a14-windows-camera-platform-focused-audit.ps1'
      - '.github/workflows/windows-camera-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell 5.1 scripts
        shell: powershell
        run: |
          foreach ($path in @(
              'scripts/a14-windows-camera-platform-audit.ps1',
              'scripts/a14-windows-camera-platform-focused-audit.ps1'
          )) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $path),
                  [ref]$tokens,
                  [ref]$errors
              )
              if ($errors.Count -ne 0) {
                  Write-Host "Parser errors in $path"
                  $errors | Format-List *
                  throw "PowerShell parser reported $($errors.Count) error(s)."
              }
          }

      - name: Enforce read-only collector invariants
        shell: powershell
        run: |
          foreach ($path in @(
              'scripts/a14-windows-camera-platform-audit.ps1',
              'scripts/a14-windows-camera-platform-focused-audit.ps1'
          )) {
              $script = Get-Content $path -Raw
              foreach ($required in @(
                  'hardware_writes=false',
                  'camera_ioctls_sent=false',
                  'Get-PnpDeviceProperty',
                  'qccamplatform',
                  'Get-AuthenticodeSignature',
                  'Get-FileHash',
                  'Compress-Archive'
              )) {
                  if (-not $script.Contains($required)) {
                      throw "$path is missing required collector invariant: $required"
                  }
              }
              if ($script -match 'DeviceIoControl|CreateFileW|WriteFile|Set-PnpDevice|Disable-PnpDevice|Enable-PnpDevice') {
                  throw "$path contains a prohibited hardware-control path."
              }
          }
